<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memo MVP - Sensor Control</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; background: #f7f7fb; color: #111; }
      .nav { margin-bottom: 20px; }
      .nav a { color: #4f46e5; text-decoration: none; margin-right: 16px; }
      .nav a:hover { text-decoration: underline; }
      .card { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 20px; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
      .status { padding: 6px 10px; border-radius: 999px; background: #eef; color: #223; font-size: 12px; }
      button { background: #4f46e5; color: #fff; border: 0; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
      button:disabled { background: #b9b6f2; cursor: not-allowed; }
      .log { background: #0c1116; color: #e6edf3; font-family: ui-monospace, Menlo, Monaco, monospace; border-radius: 8px; padding: 12px; height: 200px; overflow: auto; font-size: 12px; }
      label { font-size: 12px; color: #444; }
      input { padding: 8px; border: 1px solid #ddd; border-radius: 8px; width: 100%; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="index.html">← Home</a>
    </div>
    <div class="card">
      <h1>Memo – Sensor Control & Proactive Assistant</h1>
      <div class="row">
        <span class="status" id="sensorStatus">Sensor: idle</span>
        <span class="status" id="assistantStatus">Assistant: waiting</span>
      </div>

      <div class="grid">
        <div>
          <label>Preferred name</label>
          <input id="preferredName" placeholder="e.g., Marie" />
        </div>
        <div>
          <label>Location context</label>
          <input id="location" placeholder="e.g., kitchen" />
        </div>
      </div>

      <div class="grid-3">
        <div>
          <label>Threshold (last_value &gt;)</label>
          <input id="threshold" type="number" value="10" min="0" step="1" />
        </div>
        <div>
          <label>Cooldown (seconds)</label>
          <input id="cooldown" type="number" value="20" min="0" step="1" />
        </div>
        <div>
          <label>Latest last_value</label>
          <input id="latestValue" readonly placeholder="—" />
        </div>
      </div>

      <div class="row">
        <button id="startPolling">Start Sensor</button>
        <button id="stopPolling" disabled>Stop Sensor</button>
        <button id="testSpeak">Test Speak</button>
        <button id="micBtn" style="background: #dc2626;">🎤 Micro</button>
      </div>

      <div class="log" id="log"></div>
    </div>

    <script>
      const logEl = document.getElementById('log');
      const sensorStatusEl = document.getElementById('sensorStatus');
      const assistantStatusEl = document.getElementById('assistantStatus');
      const startBtn = document.getElementById('startPolling');
      const stopBtn = document.getElementById('stopPolling');
      const testSpeakBtn = document.getElementById('testSpeak');
      const micBtn = document.getElementById('micBtn');
      const preferredNameEl = document.getElementById('preferredName');
      const locationEl = document.getElementById('location');
      const thresholdEl = document.getElementById('threshold');
      const cooldownEl = document.getElementById('cooldown');
      const latestValueEl = document.getElementById('latestValue');

      let intervalId = null;
      let suppressUntil = 0;
      let recognition = null;
      let isListening = false;

      // Initialize Speech Recognition (STT)
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // English language
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = async (event) => {
          const transcript = event.results[0][0].transcript;
          appendLog('You said: ' + transcript);
          isListening = false;
          micBtn.textContent = '🎤 Micro';
          micBtn.style.background = '#dc2626';

          // Send to assistant
          assistantStatusEl.textContent = 'Assistant: thinking…';
          const context = {
            preferredName: preferredNameEl.value || undefined,
            location: locationEl.value || undefined,
            timeOfDay: new Date().getHours() < 12 ? 'morning' : (new Date().getHours() < 18 ? 'afternoon' : 'evening')
          };
          try {
            const res = await fetch('/api/assistant/respond', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ context, userMessage: transcript })
            });
            const data = await res.json();
            if (data?.text) {
              appendLog('Assistant: ' + data.text);
              speak(data.text);
            }
          } catch (e) {
            appendLog('Assistant error: ' + e);
          } finally {
            assistantStatusEl.textContent = 'Assistant: waiting';
          }
        };

        recognition.onerror = (event) => {
          appendLog('Recognition error: ' + event.error);
          isListening = false;
          micBtn.textContent = '🎤 Micro';
          micBtn.style.background = '#dc2626';
          assistantStatusEl.textContent = 'Assistant: waiting';
        };

        recognition.onend = () => {
          if (isListening) {
            // Restart if we were still listening
            try {
              recognition.start();
            } catch (e) {
              isListening = false;
              micBtn.textContent = '🎤 Micro';
              micBtn.style.background = '#dc2626';
            }
          }
        };
      } else {
        appendLog('Speech recognition not supported in this browser (use Chrome/Edge)');
      }

      function appendLog(msg) {
        const time = new Date().toLocaleTimeString();
        logEl.textContent += `[${time}] ${msg}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function speak(text) {
        if (!('speechSynthesis' in window)) {
          appendLog('SpeechSynthesis not supported in this browser');
          return;
        }
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.95; // slightly slower
        utter.pitch = 1.0;
        utter.volume = 1.0;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      }

      async function getAssistantMessage() {
        assistantStatusEl.textContent = 'Assistant: thinking…';
        const context = {
          preferredName: preferredNameEl.value || undefined,
          location: locationEl.value || undefined,
          timeOfDay: new Date().getHours() < 12 ? 'morning' : (new Date().getHours() < 18 ? 'afternoon' : 'evening')
        };
        try {
          const res = await fetch('/api/assistant/respond', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ context })
          });
          const data = await res.json();
          if (data?.text) {
            appendLog('Assistant: ' + data.text);
            speak(data.text);
          } else {
            appendLog('Assistant error: malformed response');
          }
        } catch (e) {
          appendLog('Assistant error: ' + e);
        } finally {
          assistantStatusEl.textContent = 'Assistant: waiting';
        }
      }

      async function pollSensorOnce() {
        try {
          sensorStatusEl.textContent = 'Sensor: polling…';
          const res = await fetch('/api/sensor');
          const data = await res.json();
          appendLog('Sensor: ' + JSON.stringify(data));
          sensorStatusEl.textContent = 'Sensor: ok';

          // Map sensor format: launch when last_value > threshold (string numeric)
          const numericLast = typeof data.last_value === 'string' ? parseFloat(data.last_value) : NaN;
          if (Number.isFinite(numericLast)) {
            latestValueEl.value = String(numericLast);
          }
          const threshold = parseFloat(thresholdEl.value || '10');
          const crossedByLastValue = Number.isFinite(numericLast) && Number.isFinite(threshold) && numericLast > threshold;
          const crossedFallback = Boolean(
            data.crossed ?? data.detected ?? data.presence ?? data.trigger ?? false
          );
          const crossed = crossedByLastValue || crossedFallback;

          const now = Date.now();
          if (crossed && now > suppressUntil) {
            const cooldownSec = Math.max(0, parseInt(cooldownEl.value || '20', 10));
            suppressUntil = now + cooldownSec * 1000;
            appendLog('Presence detected → triggering assistant');
            getAssistantMessage();
          }
        } catch (e) {
          sensorStatusEl.textContent = 'Sensor: error';
          appendLog('Sensor error: ' + e);
        }
      }

      startBtn.addEventListener('click', () => {
        if (intervalId) return;
        appendLog('Starting 2s polling');
        intervalId = setInterval(pollSensorOnce, 2000);
        pollSensorOnce(); // immediate
        startBtn.disabled = true;
        stopBtn.disabled = false;
      });

      stopBtn.addEventListener('click', () => {
        if (!intervalId) return;
        clearInterval(intervalId);
        intervalId = null;
        appendLog('Stopped polling');
        startBtn.disabled = false;
        stopBtn.disabled = true;
        sensorStatusEl.textContent = 'Sensor: idle';
      });

      testSpeakBtn.addEventListener('click', () => {
        speak('Hello, I am Memo. I am here to help you.');
      });

      // Micro button: toggle speech recognition
      micBtn.addEventListener('click', () => {
        if (!recognition) {
          appendLog('Speech recognition not available');
          return;
        }

        if (isListening) {
          recognition.stop();
          isListening = false;
          micBtn.textContent = '🎤 Micro';
          micBtn.style.background = '#dc2626';
          appendLog('Microphone disabled');
        } else {
          try {
            recognition.start();
            isListening = true;
            micBtn.textContent = '🔴 Listening...';
            micBtn.style.background = '#16a34a';
            appendLog('Microphone enabled - speak now');
          } catch (e) {
            appendLog('Error starting microphone: ' + e);
            isListening = false;
          }
        }
      });
    </script>
  </body>
</html>
