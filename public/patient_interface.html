<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Memo - My Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f7f8fc;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #16a34a; /* vert chaleureux */
        --accent-soft: #dcfce7;
        --border: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg); color: var(--text);
      }
      .wrap {
        max-width: 720px; margin: 0 auto; padding: 24px;
      }
      .card {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(2,6,23,0.06);
      }
      .header {
        display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;
      }
      .title { font-size: 22px; font-weight: 700; }
      .clock { font-size: 14px; color: var(--muted); }
      .chat {
        display: flex; flex-direction: column; gap: 10px; margin: 14px 0 18px;
      }
      .bubble {
        max-width: 85%; padding: 12px 14px; border-radius: 14px;
        font-size: 15px; line-height: 1.4; border: 1px solid var(--border);
      }
      .memo { align-self: flex-start; background: var(--accent-soft); border-color: #bbf7d0; color: #064e3b; }
      .user { align-self: flex-end; background: #eef2ff; border-color: #c7d2fe; color: #1e293b; }
      .row { display: flex; gap: 10px; }
      input[type="text"] {
        flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
        background: #fff;
      }
      button {
        background: var(--accent); color: #fff; border: 0; border-radius: 10px;
        padding: 10px 14px; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div style="margin-bottom: 16px;">
        <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">← Home</a>
      </div>
      <div class="card">
        <div class="header">
          <div class="title">Memo — My Assistant</div>
          <div class="clock" id="clock">--:--</div>
        </div>

        <div class="chat" id="chat">
          <!-- Messages will be inserted here by JS -->
        </div>

        <div class="row">
          <input id="userInput" type="text" placeholder="Your message…" />
          <button id="micBtn" style="background: #dc2626;">🎤 Micro</button>
          <button id="speakBtn">Start Conversation</button>
          <button id="demoBtn" style="background: #7c3aed;">🎬 Demo Scenario</button>
        </div>
        <div class="hint">Tip: Click "🎤 Micro" to speak, "Start Conversation" for a greeting, or "🎬 Demo Scenario" to see Memo in action.</div>
      </div>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const clock = document.getElementById('clock');
      const input = document.getElementById('userInput');
      const speakBtn = document.getElementById('speakBtn');
      const micBtn = document.getElementById('micBtn');
      const demoBtn = document.getElementById('demoBtn');

      // Verify elements exist
      if (!speakBtn) {
        console.error('speakBtn element not found!');
      } else {
        console.log('speakBtn element found:', speakBtn);
      }

      // Demo profile data with family information
      const demoProfile = {
        name: 'Marie',
        preferredName: 'Marie',
        location: 'kitchen',
        doctor: 'Dr. Martin',
        favoriteEvent: 'Saturday dance',
        keyMemory: 'Vacation in Nice 1998',
        family: {
          spouse: 'Jean',
          children: ['Sophie', 'Pierre'],
          caregiver: 'Sophie',
          emergencyContact: 'Jean',
          phone: '+33 6 12 34 56 78'
        },
        routines: {
          morning: 'Take vitamins with breakfast',
          afternoon: 'Hydration reminder at 2pm',
          evening: 'Check medication'
        },
        games: {
          favorites: ['Memory Cards', 'Name That Tune', 'Story Time'],
          lastPlayed: 'Memory Cards',
          lastPlayedDate: 'Yesterday'
        }
      };

      const patientName = demoProfile.preferredName;
      const locationCtx = demoProfile.location;
      const sessionId = 'patient_' + Date.now();
      
      // Demo scenario data
      const demoScenarios = [
        {
          trigger: 'morning',
          time: '08:30',
          message: `Good morning ${demoProfile.preferredName}! I see you're in the ${demoProfile.location}. It's time for your morning vitamins. Would you like me to remind you where they are?`,
          context: { location: demoProfile.location, timeOfDay: 'morning' }
        },
        {
          trigger: 'afternoon',
          time: '14:00',
          message: `Hi ${demoProfile.preferredName}, it's been a while since you've had some water. Would you like a gentle reminder to stay hydrated?`,
          context: { location: 'living room', timeOfDay: 'afternoon' }
        },
        {
          trigger: 'evening',
          time: '18:00',
          message: `Good evening ${demoProfile.preferredName}! I hope you're having a nice day. Have you taken your evening medication?`,
          context: { location: demoProfile.location, timeOfDay: 'evening' }
        }
      ];
      let recognition = null;
      let isListening = false;

      // Initialize Speech Recognition (STT)
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // English language
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = async (event) => {
          const transcript = event.results[0][0].transcript;
          addBubble(transcript, 'user');
          isListening = false;
          micBtn.textContent = '🎤 Micro';
          micBtn.style.background = '#dc2626';

          // Send to assistant API
          try {
            const res = await fetch('/api/assistant/respond', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                context: {
                  preferredName: patientName,
                  location: locationCtx,
                  timeOfDay: new Date().getHours() < 12 ? 'morning' : (new Date().getHours() < 18 ? 'afternoon' : 'evening')
                },
                userMessage: transcript,
                sessionId: sessionId
              })
            });
            const data = await res.json();
            if (data?.text) {
              addBubble(data.text, 'memo');
              speak(data.text);
            }
          } catch (e) {
            addBubble('Erreur: ' + e, 'memo');
          }
        };

        recognition.onerror = (event) => {
            addBubble('Recognition error: ' + event.error, 'memo');
          isListening = false;
          micBtn.textContent = '🎤 Micro';
          micBtn.style.background = '#dc2626';
        };

        recognition.onend = () => {
          if (isListening) {
            try {
              recognition.start();
            } catch (e) {
              isListening = false;
              micBtn.textContent = '🎤 Micro';
              micBtn.style.background = '#dc2626';
            }
          }
        };
      }

      function updateClock() {
        const d = new Date();
        clock.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      setInterval(updateClock, 1000); updateClock();

      function addBubble(text, who = 'memo') {
        const div = document.createElement('div');
        div.className = 'bubble ' + (who === 'memo' ? 'memo' : 'user');
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function speak(text) {
        if (!('speechSynthesis' in window)) return;
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.95; u.pitch = 1.0; u.volume = 1.0;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      }

      async function simulateScenario() {
        console.log('Start Conversation button clicked');
        
        // Visual feedback
        if (speakBtn) {
          speakBtn.disabled = true;
          speakBtn.textContent = 'Starting...';
        }
        
        addBubble('Starting conversation...', 'memo');
        
        // Start proactive conversation
        try {
          const context = {
            preferredName: patientName,
            location: locationCtx,
            timeOfDay: new Date().getHours() < 12 ? 'morning' : (new Date().getHours() < 18 ? 'afternoon' : 'evening')
          };
          
          console.log('Sending request:', { context, sessionId });
          
          const res = await fetch('/api/assistant/respond', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              context: context,
              sessionId: sessionId
            })
          });
          
          console.log('Response status:', res.status);
          
          if (!res.ok) {
            const errorData = await res.json();
            throw new Error(`Server error: ${res.status} - ${JSON.stringify(errorData)}`);
          }
          
          const data = await res.json();
          console.log('Response data:', data);
          
          if (data?.text) {
            addBubble(data.text, 'memo');
            speak(data.text);
          } else {
            addBubble('Error: No text in response', 'memo');
            console.error('No text in response:', data);
          }
        } catch (err) {
          console.error('Error in simulateScenario:', err);
          addBubble('Error: ' + err.message, 'memo');
        } finally {
          // Re-enable button
          if (speakBtn) {
            speakBtn.disabled = false;
            speakBtn.textContent = 'Start Conversation';
          }
        }
      }

      // Helper function to wait for speech to finish (approximate)
      function waitForSpeech(text, baseDelay = 2000) {
        // Estimate speech time: ~150 words per minute, ~5 chars per word
        const words = text.split(' ').length;
        const estimatedTime = (words / 150) * 60 * 1000; // in milliseconds
        return Math.max(baseDelay, estimatedTime + 500); // add 500ms buffer
      }

      // Demo scenario function
      async function runDemoScenario() {
        if (demoBtn) {
          demoBtn.disabled = true;
          demoBtn.textContent = 'Running Demo...';
        }
        
        addBubble('🎬 Starting demo scenario...', 'memo');
        
        // Show welcome message
        await new Promise(resolve => setTimeout(resolve, 1500));
        const welcomeMsg = `Hello! I'm Memo, your caring assistant. Let me show you how I can help ${demoProfile.preferredName} throughout the day.`;
        addBubble(welcomeMsg, 'memo');
        speak(welcomeMsg);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(welcomeMsg)));
        
        // Morning scenario
        addBubble(`[${demoScenarios[0].time}] Morning routine`, 'memo');
        await new Promise(resolve => setTimeout(resolve, 800));
        addBubble(demoScenarios[0].message, 'memo');
        speak(demoScenarios[0].message);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(demoScenarios[0].message)));
        
        addBubble('Yes, please remind me', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const morningResponse = 'Your vitamins are in the kitchen cabinet, second shelf from the top. They should be taken with breakfast. Would you like me to set a reminder for tomorrow?';
        addBubble(morningResponse, 'memo');
        speak(morningResponse);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(morningResponse)));
        
        addBubble('That would be nice, thank you', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const reminderSet = 'Perfect! I\'ve set a reminder for tomorrow morning. Now, would you like to play a quick memory game? It\'s a great way to start your day!';
        addBubble(reminderSet, 'memo');
        speak(reminderSet);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(reminderSet)));
        
        addBubble('Sure, that sounds fun!', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const gameIntro = 'Wonderful! Let\'s play "Name That Tune". I\'ll play a familiar melody, and you can try to remember what it is. Ready?';
        addBubble(gameIntro, 'memo');
        speak(gameIntro);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(gameIntro)));
        
        addBubble('Yes, I\'m ready!', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const gameResult = 'Great! That was lovely. You remembered it perfectly! Games like this help keep our minds active. Well done!';
        addBubble(gameResult, 'memo');
        speak(gameResult);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(gameResult)));
        
        // Afternoon scenario
        await new Promise(resolve => setTimeout(resolve, 2000));
        addBubble(`[${demoScenarios[1].time}] Afternoon check-in`, 'memo');
        await new Promise(resolve => setTimeout(resolve, 800));
        addBubble(demoScenarios[1].message, 'memo');
        speak(demoScenarios[1].message);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(demoScenarios[1].message)));
        
        addBubble('That would be helpful, thank you', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const hydrationResponse = 'You\'re welcome! I\'ll remind you again in a couple of hours. Remember, staying hydrated is important for your wellbeing.';
        addBubble(hydrationResponse, 'memo');
        speak(hydrationResponse);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(hydrationResponse)));
        
        // Evening scenario
        await new Promise(resolve => setTimeout(resolve, 2000));
        addBubble(`[${demoScenarios[2].time}] Evening routine`, 'memo');
        await new Promise(resolve => setTimeout(resolve, 800));
        addBubble(demoScenarios[2].message, 'memo');
        speak(demoScenarios[2].message);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(demoScenarios[2].message)));
        
        addBubble('I think I already took them', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const eveningResponse = 'That\'s wonderful! You\'re doing great staying on top of your medication. Before we finish, would you like to play a quick story game? We can share memories together.';
        addBubble(eveningResponse, 'memo');
        speak(eveningResponse);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(eveningResponse)));
        
        addBubble('Oh, that sounds nice', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const storyGame = `Perfect! Let's talk about your family. I remember you mentioned ${demoProfile.family.children.join(' and ')}. Can you tell me something nice about them?`;
        addBubble(storyGame, 'memo');
        speak(storyGame);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(storyGame)));
        
        addBubble('They are both so kind and visit me often', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const storyResponse = `That's beautiful, Marie. Family is so important. ${demoProfile.family.caregiver} especially cares a lot about you. You're very lucky to have such a loving family.`;
        addBubble(storyResponse, 'memo');
        speak(storyResponse);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(storyResponse)));
        
        await new Promise(resolve => setTimeout(resolve, 2000));
        addBubble('No, that\'s all. Thank you, Memo', 'user');
        await new Promise(resolve => setTimeout(resolve, 2000));
        const farewell = `You're very welcome, Marie. I'm here whenever you need me. Have a peaceful evening, and remember, ${demoProfile.family.spouse} and your family are always thinking of you!`;
        addBubble(farewell, 'memo');
        speak(farewell);
        await new Promise(resolve => setTimeout(resolve, waitForSpeech(farewell)));
        
        await new Promise(resolve => setTimeout(resolve, 2000));
        addBubble('🎬 Demo scenario completed. This shows how Memo proactively helps throughout the day with gentle reminders, games for cognitive stimulation, and family connections.', 'memo');
        
        if (demoBtn) {
          demoBtn.disabled = false;
          demoBtn.textContent = '🎬 Demo Scenario';
        }
      }

      // Attach demo button
      if (demoBtn) {
        demoBtn.addEventListener('click', runDemoScenario);
      }

      // Wait for DOM to be fully loaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          if (speakBtn) {
            speakBtn.addEventListener('click', simulateScenario);
            console.log('Start Conversation button event listener attached (DOMContentLoaded)');
          }
        });
      } else {
        if (speakBtn) {
          speakBtn.addEventListener('click', simulateScenario);
          console.log('Start Conversation button event listener attached (immediate)');
        } else {
          console.error('speakBtn not found when attaching listener');
        }
      }

      // Micro button: toggle speech recognition
      micBtn.addEventListener('click', () => {
        if (!recognition) {
          addBubble('Speech recognition not available (use Chrome/Edge)', 'memo');
          return;
        }

        if (isListening) {
          recognition.stop();
          isListening = false;
          micBtn.textContent = '🎤 Micro';
          micBtn.style.background = '#dc2626';
        } else {
          try {
            recognition.start();
            isListening = true;
            micBtn.textContent = '🔴 Listening...';
            micBtn.style.background = '#16a34a';
          } catch (e) {
            addBubble('Error starting microphone: ' + e, 'memo');
            isListening = false;
          }
        }
      });

      input.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter' && input.value.trim()) {
          const userText = input.value.trim();
          addBubble(userText, 'user');
          input.value = '';

          // Send to assistant
          try {
            const res = await fetch('/api/assistant/respond', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                context: {
                  preferredName: patientName,
                  location: locationCtx,
                  timeOfDay: new Date().getHours() < 12 ? 'morning' : (new Date().getHours() < 18 ? 'afternoon' : 'evening')
                },
                userMessage: userText,
                sessionId: sessionId
              })
            });
            const data = await res.json();
            if (data?.text) {
              addBubble(data.text, 'memo');
              speak(data.text);
            }
          } catch (err) {
            addBubble('Error: ' + err, 'memo');
          }
        }
      });
    </script>
  </body>
</html>
