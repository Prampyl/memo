<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Memo - Family Space / Marie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f6f9ff;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --blue: #2563eb;
        --blue-soft: #dbeafe;
        --border: #e2e8f0;
        --ok: #16a34a;
        --warn: #b45309;
        --alert: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg); color: var(--text);
      }
      .wrap { max-width: 1024px; margin: 0 auto; padding: 24px; }
      .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
      .card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
        box-shadow: 0 8px 24px rgba(2,6,23,0.06);
      }
      .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
      .title { font-weight: 800; font-size: 22px; }
      .muted { color: var(--muted); font-size: 13px; }
      .status {
        display: inline-flex; align-items: center; gap: 8px; background: var(--blue-soft);
        color: var(--blue); padding: 8px 10px; border-radius: 999px; font-weight: 600; font-size: 13px;
      }
      ul { margin: 8px 0 0; padding-left: 16px; }
      li { margin: 6px 0; }
      .row { display: flex; gap: 10px; }
      label { font-size: 13px; color: var(--muted); }
      input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; }
      button {
        background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer;
      }
      .danger { background: var(--alert); }
      .section-title { font-weight: 700; margin-bottom: 6px; }
      .list { border: 1px dashed var(--border); border-radius: 10px; padding: 10px; background: #fafcff; }
      .footer-note { margin-top: 10px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div style="margin-bottom: 16px;">
        <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">← Home</a>
      </div>
      <div class="header">
        <div class="title">Memo — Family Space / Marie</div>
        <div class="muted">Today: <span id="today">—</span></div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="section-title">Safety Dashboard</div>
          <div id="statusBadge" class="status">
            <span>Status: All good</span>
          </div>
          <div class="footer-note" id="presenceNote">No prolonged presence detected.</div>
        </div>

        <div class="card">
          <div class="section-title">Activity Log (Last 5)</div>
          <div class="list">
            <ul id="journalList"></ul>
          </div>
        </div>

        <div class="card">
          <div class="section-title">Life Repertoire Management</div>
          <div class="row">
            <div style="flex:1">
              <label>Doctor's Name</label>
              <input id="doctor" placeholder="Dr Martin" />
            </div>
            <div style="flex:1">
              <label>Favorite Event</label>
              <input id="event" placeholder="Saturday Ball" />
            </div>
          </div>
          <div class="row" style="margin-top:10px">
            <div style="flex:1">
              <label>Key Memory</label>
              <input id="memory" placeholder="1998 holidays in Nice" />
            </div>
            <div style="flex:0 0 auto; align-self:flex-end">
              <button id="saveProfile">Save</button>
            </div>
          </div>
          <div class="footer-note" id="saveHint">Information is stored locally (simulation).</div>
        </div>

        <div class="card">
          <div class="section-title">Contact</div>
          <div class="row">
            <button id="contactBtn">Contact Patient</button>
            <button class="danger" id="alertBtn">Discreet Alert</button>
          </div>
          <div class="footer-note" id="contactHint">Simulation: sending a discreet message (not actually sent).</div>
        </div>
      </div>
    </div>

    <script>
      const today = document.getElementById('today');
      const journalList = document.getElementById('journalList');
      const statusBadge = document.getElementById('statusBadge');
      const presenceNote = document.getElementById('presenceNote');
      const saveProfileBtn = document.getElementById('saveProfile');
      const doctorEl = document.getElementById('doctor');
      const eventEl = document.getElementById('event');
      const memoryEl = document.getElementById('memory');
      const spouseEl = document.getElementById('spouse');
      const caregiverEl = document.getElementById('caregiver');
      const childrenEl = document.getElementById('children');
      const phoneEl = document.getElementById('phone');
      const contactBtn = document.getElementById('contactBtn');
      const alertBtn = document.getElementById('alertBtn');
      const contactHint = document.getElementById('contactHint');
      const saveHint = document.getElementById('saveHint');

      // Date
      today.textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'long' });

      // Enhanced demo journal with realistic entries
      const entries = [
        { time: '14:15', label: 'Hydration reminder - Confirmed water intake', status: 'completed' },
        { time: '10:30', label: 'Medication check - Morning vitamins confirmed', status: 'completed' },
        { time: '09:00', label: 'Proactive greeting - Kitchen presence detected', status: 'completed' },
        { time: '08:30', label: 'Morning routine reminder - Started conversation', status: 'completed' },
        { time: 'Yesterday 18:00', label: 'Evening medication - Confirmed taken', status: 'completed' },
        { time: 'Yesterday 14:00', label: 'Afternoon hydration - Gentle reminder given', status: 'completed' },
        { time: 'Yesterday 12:00', label: 'Lunch reminder - Confirmed meal', status: 'completed' },
      ];
      function renderJournal() {
        journalList.innerHTML = '';
        for (const e of entries) {
          const li = document.createElement('li');
          const statusIcon = e.status === 'completed' ? '✅' : '⏳';
          li.textContent = `${statusIcon} ${e.time} — ${e.label}`;
          li.style.marginBottom = '8px';
          li.style.padding = '4px 0';
          journalList.appendChild(li);
        }
      }
      renderJournal();

      // Simulated safety
      let prolongedPresence = false;
      function updateSafety() {
        if (prolongedPresence) {
          statusBadge.style.background = '#fee2e2';
          statusBadge.style.color = '#b91c1c';
          presenceNote.textContent = 'Alert: Prolonged presence detected in the bedroom.';
        } else {
          statusBadge.style.background = '#dbeafe';
          statusBadge.style.color = '#2563eb';
          presenceNote.textContent = 'No prolonged presence detected.';
        }
      }
      updateSafety();

      // Toggle simulation every 15s
      setInterval(() => {
        prolongedPresence = !prolongedPresence;
        updateSafety();
      }, 15000);

      // Load profile from database
      async function loadProfile() {
        try {
          const res = await fetch('/api/patient/default');
          if (res.ok) {
            const patient = await res.json();
            doctorEl.value = patient.doctor || '';
            eventEl.value = patient.favoriteEvent || '';
            memoryEl.value = patient.keyMemory || '';
            spouseEl.value = patient.family?.spouse || '';
            caregiverEl.value = patient.family?.caregiver || '';
            childrenEl.value = patient.family?.children?.join(', ') || '';
            phoneEl.value = patient.family?.phone || '';
          } else {
            // Load demo data if API fails
            loadDemoData();
          }
        } catch (err) {
          console.error('Error loading profile:', err);
          loadDemoData();
        }
      }
      
      function loadDemoData() {
        doctorEl.value = 'Dr. Martin';
        eventEl.value = 'Saturday dance';
        memoryEl.value = 'Vacation in Nice 1998';
        spouseEl.value = 'Jean';
        caregiverEl.value = 'Sophie';
        childrenEl.value = 'Sophie, Pierre';
        phoneEl.value = '+33 6 12 34 56 78';
      }
      
      async function saveProfile() {
        const children = childrenEl.value.split(',').map(c => c.trim()).filter(c => c);
        const patientData = {
          doctor: doctorEl.value.trim(),
          favoriteEvent: eventEl.value.trim(),
          keyMemory: memoryEl.value.trim(),
          family: {
            spouse: spouseEl.value.trim(),
            caregiver: caregiverEl.value.trim(),
            children: children,
            phone: phoneEl.value.trim()
          }
        };
        
        try {
          const res = await fetch('/api/patient/patient_001', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(patientData)
          });
          
          if (res.ok) {
            saveHint.textContent = '✅ Data saved successfully!';
            setTimeout(() => saveHint.textContent = 'Information is saved in the database.', 2500);
          } else {
            throw new Error('Save failed');
          }
        } catch (err) {
          console.error('Error saving profile:', err);
          saveHint.textContent = '❌ Error saving data.';
          setTimeout(() => saveHint.textContent = 'Information is stored locally (simulation).', 2500);
        }
      }
      loadProfile();
      saveProfileBtn.addEventListener('click', saveProfile);

      // Contact (simulation)
      contactBtn.addEventListener('click', () => {
        contactHint.textContent = 'Discreet message sent (simulation).';
        setTimeout(() => contactHint.textContent = 'Simulation: sending a discreet message (not actually sent).', 2500);
      });
      alertBtn.addEventListener('click', () => {
        contactHint.textContent = 'Urgent alert sent (simulation).';
        setTimeout(() => contactHint.textContent = 'Simulation: sending a discreet message (not actually sent).', 2500);
      });
    </script>
  </body>
</html>
